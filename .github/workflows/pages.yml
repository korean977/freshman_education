name: Publish education website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify AC protection
        run: node tests/ac-protection.test.js
      - name: Verify R1 sequence
        run: node tests/r1-sequence.test.js
      - name: Verify R2 sequence
        run: node tests/r2-sequence.test.js
      - name: Verify R3 sequence
        run: node tests/r3-sequence.test.js
      - name: Verify primary-side voltage and 84 relays
        run: node tests/primary-voltage.test.js
      - name: Verify S1 source logic
        run: node tests/s1-sequence.test.js
      - name: Verify remaining station source logic
        run: node tests/station-sequence.test.js
      - name: Package static website
        run: python3 scripts/build_site.py
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check GitHub Pages configuration
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
